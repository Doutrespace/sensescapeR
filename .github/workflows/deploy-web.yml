# Builds the web version of the app and publishes it to GitHub Pages.
#
# One-time setup in the GitHub repository:
#   1. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#   2. Settings -> Secrets and variables -> Actions -> New repository secret:
#        EXPO_PUBLIC_SUPABASE_URL       (https://<project>.supabase.co)
#        EXPO_PUBLIC_SUPABASE_ANON_KEY  (the public "anon" key, never the service key)
#   3. In Supabase: Authentication -> URL Configuration, add the published site
#      URL (https://<user>.github.io/<repository>/) as Site URL / redirect URL so
#      sign-up confirmation emails link back to the web app.
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web app
        run: npm run build:web
        env:
          # A project site is served from /<repository-name>/.
          WEB_BASE_PATH: /${{ github.event.repository.name }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
